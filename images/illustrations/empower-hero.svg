  <circle cx="408" cy="141" r="5" fill="#fff"/>
  <circle cx="426" cy="141" r="5" fill="#fff"/>
  <line x1="417" y1="132" x2="417" y2="126" stroke="#050505" stroke-width="3" stroke-linecap="round"/>
